# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 双保险：系统 JAVA_HOME 指向失效的 JDK 14，这里钉死本机可用的 JDK 17
org.gradle.java.home=D:/insbuild/jdk17/jdk-17.0.20.1+1
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Only keep the R class for the current module
android.nonTransitiveRClass=true
# 工作区路径含中文（d:\桌面（2）\），AGP 默认直接拒绝构建。
# 逃生阀：跳过路径检查。若后续 aapt2 仍报错，则按技术选型.md 风险#2 迁到 D:\fitrecord\ 构建。
android.overridePathCheck=true
